[package]
name = "mimicmail"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Draft emails using the user's past writing style"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.16"
getrandom = "0.3"
html-escape = "0.2"
html5ever = "0.35"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
mailparse = "0.16"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "signal", "process", "io-util", "macros"] }
unicode-casefold = "0.2"
unicode-general-category = "1"
unicode-normalization = "0.1"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
