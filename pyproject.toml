[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mimicmail"
version = "0.1.0"
description = "Draft emails using the user's past writing style."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mimicmail = "mimicmail.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mimicmail = ["static/*"]
